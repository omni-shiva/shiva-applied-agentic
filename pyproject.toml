[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiva-applied-agentic"
version = "0.1.0"
description = "A safe, evaluation-driven agent for data-platform incident diagnosis."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Shivanand Kumar"}]
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=2.14,<3",
  "pydantic>=2.10,<3",
  "qdrant-client>=1.12,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
reliability-agent-eval = "reliability_agent.evaluation:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=reliability_agent --cov-report=term-missing"
